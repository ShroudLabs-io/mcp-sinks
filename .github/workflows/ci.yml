name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: Lint ruleset
        run: semgrep --validate --config mcp-sinks.yml
      - name: Self-test against fixtures
        run: python scripts/check_fixtures.py
